version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: infraos
      POSTGRES_USER: infraos
      POSTGRES_PASSWORD: infraos_dev_password
    ports:
      - "5432:5432"
    volumes:
      - infraos_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U infraos"]
      interval: 5s
      timeout: 5s
      retries: 10

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - infraos_es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200 >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      INFRAOS_DATABASE_URL: postgresql://infraos:infraos_dev_password@postgres:5432/infraos
      INFRAOS_ELASTICSEARCH_URL: http://elasticsearch:9200
      # INFRAOS_VAULT_KEY: set this to a real Fernet key in production --
      # left unset here generates an ephemeral one at container start,
      # which is fine for a demo but loses stored credentials on restart.
    ports:
      - "3100:3100"
    depends_on:
      postgres:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "3110:80"
    depends_on:
      - backend

volumes:
  infraos_postgres_data:
  infraos_es_data:
