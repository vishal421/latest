# Reverse-proxies the InfraOS backend so the browser only ever talks to
# this container's own origin -- no hardcoded backend host/port ships
# in the frontend JS bundle, and no CORS handling is needed since every
# request is same-origin from the browser's point of view.
#
# BACKEND_HOST/BACKEND_PORT below assume Docker Compose's default
# networking, where services reach each other by service name
# ("backend") on the compose network. Override via a build ARG /
# envsubst step if you deploy the frontend and backend as genuinely
# separate hosts.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

upstream infraos_backend {
    server backend:3100;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # React Router client-side routes (e.g. /configuration/devices) --
    # fall back to index.html for anything that isn't a real static
    # asset or one of the API prefixes matched below.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Every top-level path the backend actually serves (see
    # backend/app/main.py's router prefixes). Kept as an explicit list
    # rather than proxying "everything nginx doesn't recognize" so SPA
    # client-side routes and API routes can never collide.
    location ~ ^/(devices|health|logs|diagnostics|topology|cli|identities|alarms|licenses|sessions|traffic-analytics|config-backups|automations|reports|settings)(/|$) {
        proxy_pass http://infraos_backend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Needed for the /cli/ws/{device_id} WebSocket terminal endpoint;
        # harmless no-op for plain HTTP requests.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
    }
}
